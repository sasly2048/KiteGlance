name: Release

# Publishes signed-off binaries to a GitHub Release whenever a version tag
# (e.g. v1.0.0) is pushed. Build/preflight on every push lives in build.yml;
# this workflow is only about cutting a release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the Release and upload assets

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-arm64, win-x64]
    steps:
      - uses: actions/checkout@v4

      - name: Run pre-flight
        run: python scripts/preflight.py

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (Release, self-contained)
        working-directory: src/KiteGlance
        run: >
          dotnet publish
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=none
          -o publish/${{ matrix.rid }}

      - name: Rename for release
        # `powershell` (the Windows-native 5.1) is preferred over `pwsh`
        # (PowerShell Core 7) so the workflow runs on every Windows runner,
        # including the older `windows-2019` images that pre-date Core. The
        # commands used here are 5.1-compatible.
        #
        # The architecture suffix is required: an un-suffixed KiteGlance.exe
        # attached to a release was the entire cause of the v1.5 "isn't
        # working on other PCs" reports -- users cannot tell which CPU the
        # binary is for from the filename alone, and an ARM64 PE silently
        # fails to load on an x64 PC. Never upload a bare KiteGlance.exe.
        shell: powershell
        run: |
          $dir = "src/KiteGlance/publish/${{ matrix.rid }}"
          Rename-Item "$dir/KiteGlance.exe" "KiteGlance-${{ matrix.rid }}.exe"

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v4
        with:
          name: KiteGlance-${{ matrix.rid }}
          path: src/KiteGlance/publish/${{ matrix.rid }}/KiteGlance-${{ matrix.rid }}.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify architecture-suffixed assets
        # Defence in depth against the v1.5 "single un-suffixed exe" bug:
        # refuse to publish any release whose artifacts don't include the
        # RID. Anyone manually uploading a bare KiteGlance.exe will trip
        # this check before it reaches end users.
        shell: bash
        run: |
          missing=$(find artifacts -maxdepth 3 -type f -name 'KiteGlance.exe' | wc -l)
          if [ "$missing" -ne 0 ]; then
            echo "::error::Found a bare KiteGlance.exe in the artifacts."
            echo "::error::Every published binary must be named KiteGlance-win-<arch>.exe."
            find artifacts -maxdepth 3 -type f -name 'KiteGlance.exe'
            exit 1
          fi
          echo "OK: all artifacts are architecture-suffixed."
          find artifacts -maxdepth 3 -type f -name 'KiteGlance-*.exe'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/KiteGlance-*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
